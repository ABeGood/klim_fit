<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Coach - FitCoach{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="coach-shell">
        <nav class="side-nav" aria-label="Coach">
            <a href="/admin/dashboard" class="brand"><span class="brand-mark">F</span> FitCoach</a>
            <a href="/admin/dashboard" class="nav-item" {% if nav == 'home' %}aria-current="page"{% endif %}>Home</a>
            <a href="/admin/users" class="nav-item" {% if nav == 'clients' %}aria-current="page"{% endif %}>Clients</a>
            <a href="/admin/templates" class="nav-item" {% if nav == 'templates' %}aria-current="page"{% endif %}>Templates</a>
            <a href="/admin/exercises" class="nav-item" {% if nav == 'exercises' %}aria-current="page"{% endif %}>Exercises</a>
            <div class="nav-foot">
                <div class="nav-who">
                    {% if profile_picture %}
                    <img src="{{ profile_picture }}" alt="" class="avatar">
                    {% else %}
                    <span class="avatar" aria-hidden="true">{{ (name or 'C')[:1] }}</span>
                    {% endif %}
                    <span>{{ name }}</span>
                </div>
                <a href="/change_password" class="nav-item">Change password</a>
                <a href="/logout" class="nav-item">Log out</a>
            </div>
        </nav>

        <main class="coach-main {% block main_class %}{% endblock %}">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div class="flash-messages" role="status">
        {% for msg in messages or [] %}
        <div class="alert alert-{{ msg.category }}">
            <span>{{ msg.message }}</span>
            <button type="button" class="close-btn" aria-label="Dismiss">&times;</button>
        </div>
        {% endfor %}
    </div>

    <script src="/static/js/ui.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
