<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}FitCoach{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="client-shell">
        {% block content %}{% endblock %}
    </div>

    <div class="flash-messages" role="status">
        {% for msg in messages or [] %}
        <div class="alert alert-{{ msg.category }}">
            <span>{{ msg.message }}</span>
            <button type="button" class="close-btn" aria-label="Dismiss">&times;</button>
        </div>
        {% endfor %}
    </div>

    <script src="/static/js/ui.js"></script>
    {% block scripts %}{% endblock %}
    {% if dev_reload %}<script src="/static/js/dev-reload.js"></script>{% endif %}
</body>
</html>
