[project]
name = "fitcoach"
version = "0.1.0"
description = "Fitness-coaching web app: coaches build workouts and assign them to clients"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.2",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "bcrypt>=5.0.0",
    "authlib>=1.9.1",
    "httpx>=0.28.1",
]

[tool.uv]
package = false
